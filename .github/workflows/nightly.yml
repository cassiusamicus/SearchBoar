name: Nightly Build

on:
  schedule:
    - cron: '0 6 * * *' # 6 AM UTC daily
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

env:
  # The same GUI dev libraries the README lists as a local build
  # requirement -- Fyne's desktop backend links GLFW/OpenGL/X11/Wayland via
  # cgo, so a plain `go build` needs real headers for all of them, not just
  # a cross toolchain. (fyne-cross's Docker images were tried first, but
  # their bundled headers are missing EGL -- an unresolved upstream bug,
  # see fyne-io/fyne#6055 -- so this builds directly instead.)
  FYNE_APT_DEPS: >-
    gcc libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev
    libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev

jobs:
  # amd64 and arm64 build natively on GitHub's own Ubuntu runners (no
  # cross-compilation at all -- ubuntu-24.04-arm is a real arm64 machine),
  # which sidesteps cross-toolchain/header mismatches entirely.
  build-native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $FYNE_APT_DEPS

      - name: Build
        run: go build -ldflags="-s -w" -o searchboar-linux-${{ matrix.arch }} ./cmd/searchboar

      - name: Package
        run: tar -cJf searchboar-linux-${{ matrix.arch }}.tar.xz searchboar-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: searchboar-linux-${{ matrix.arch }}
          path: searchboar-linux-${{ matrix.arch }}.tar.xz

  # No GitHub-hosted armv7 (32-bit) runner exists. QEMU + a real armv7
  # container gives a genuinely native build (apt installs and cgo compile
  # all happen inside an actual armv7 environment, just emulated) rather
  # than a cross toolchain with its own sysroot/header mismatches to chase.
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - name: Build inside an emulated armv7 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD":/src -w /src \
            golang:1-bookworm bash -c "
              apt-get update &&
              apt-get install -y $FYNE_APT_DEPS &&
              go build -ldflags='-s -w' -o searchboar-linux-armv7 ./cmd/searchboar
            "
          tar -cJf searchboar-linux-armv7.tar.xz searchboar-linux-armv7

      - uses: actions/upload-artifact@v7
        with:
          name: searchboar-linux-armv7
          path: searchboar-linux-armv7.tar.xz

  release:
    needs: [build-native, build-armv7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly -y --repo ${{ github.repository }} 2>/dev/null || true

      - name: Delete nightly tag
        run: |
          git clone --bare https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} repo
          cd repo
          git tag -d nightly 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            --repo ${{ github.repository }} \
            --title "Nightly Build" \
            --notes "Automated nightly build from main. Updated daily at 6 AM UTC. Linux only: amd64, arm64, armv7." \
            --prerelease \
            artifacts/*
